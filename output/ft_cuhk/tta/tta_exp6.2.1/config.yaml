


## Test Time Adapt
tta_model: '' #需要进行tta的model.modules()

sample_selection: all

batch_size_tta: 16
k_tta: 8

optimizer: {opt: adamW, lr: 1e-4, weight_decay: 0.01, lr_mult: 2}
schedular: {sched: step, lr: 1e-4, epochs: 30, num_warmup_steps: 100}

score_temper: 1.0

# uncertainty: 'inversed_recall_proba'
# uncertainty_temper: 1.0
# uncertainty_temper_is_learnable: True
# uncertainty_t2i_temper: 1.0
# uncertainty_i2t_temper: 1.0

is_prompt_learning: true
prompt_learning_token_num: 4




image_root: images/CUHK-PEDES/imgs/
test_file: data/finetune/cuhk_test.json
# val_file: 'data/finetune/cuhk_val.json'
# train_file:  ['data/finetune/cuhk_train.json']
tta_file: data/finetune/cuhk_test.json


## Vision Encoder
vision_config: configs/config_swinB_384.json
image_res: 384
patch_size: 32
h: 384
w: 128


## Text Encoder
text_config: configs/config_bert.json
text_encoder: data/bert-base-uncased


## Training
batch_size_train: 120
batch_size_test: 150
batch_size_test_text: 750

max_tokens: 56
max_words: 56

embed_dim: 256
temp: 0.07
k_test: 128


## mlm loss
mlm: true
mask_prob: 0.25
max_masks: 10
skipgram_prb: 0.2
skipgram_size: 3
mask_whole_word: true


# ## Other Settings
# optimizer: {opt: adamW, lr: 1e-4, weight_decay: 0.01, lr_mult: 2}
# schedular: {sched: step, lr: 1e-4, epochs: 30, num_warmup_steps: 0.1}

pa100k: false
icfg_rstp: false

lr_2: true
load_params: false
load_pretrained: true

eda: true
eda_p: 1
erasing_p: 0.6
LabelSmooth: 0
